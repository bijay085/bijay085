<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Terminal readout: Bijay Koirala, Python automation, technical SEO and Chrome extensions. Ships scrapers, Telegram bots, ClickUp sync and Search Console reports. Open for freelance from Nepal, replies under 24 hours." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Bijay Koirala: Python automation, technical SEO, Chrome extensions. Open for freelance.</title>

  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ADB5"/>
      <stop offset="1" stop-color="#0F4C5C"/>
    </linearGradient>
  </defs>

  <style>
    .mono   { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }
    .cmd    { font-size: 17px; fill: #00ADB5; }
    .out    { font-size: 17px; fill: #c9d1d9; }
    .dim    { font-size: 15px; fill: #7d8590; }
    .name   { font-size: 27px; fill: #ffffff; font-weight: 700; letter-spacing: .5px; }

    .row { opacity: 0; animation: reveal .4s ease-out forwards; }
    .d1 { animation-delay: .15s } .d2 { animation-delay: .45s }
    .d3 { animation-delay: .95s } .d4 { animation-delay: 1.25s }
    .d5 { animation-delay: 1.75s } .d6 { animation-delay: 2.05s }
    .d7 { animation-delay: 2.55s } .d8 { animation-delay: 2.85s }

    .rule   { stroke: url(#edge); stroke-width: 2.5; stroke-linecap: round;
              stroke-dasharray: 300; stroke-dashoffset: 300;
              animation: draw 1.1s ease-out .5s forwards; }
    .cursor { fill: #00ADB5; opacity: 0; animation: blink 1.05s steps(1) 3.2s infinite; }
    .pulse  { animation: pulse 3.4s ease-in-out infinite; }

    @keyframes reveal { from { opacity: 0; transform: translateY(7px) } to { opacity: 1; transform: translateY(0) } }
    @keyframes draw   { to { stroke-dashoffset: 0 } }
    @keyframes blink  { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
    @keyframes pulse  { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }

    @media (prefers-reduced-motion: reduce) {
      .row { opacity: 1; animation: none }
      .rule { stroke-dashoffset: 0; animation: none }
      .cursor { opacity: 1; animation: none }
      .pulse { animation: none }
    }
  </style>

  <!-- window -->
  <rect x="1.5" y="1.5" width="897" height="327" rx="14" fill="#020B20" stroke="#00ADB5" stroke-opacity=".35"/>
  <line x1="1.5" y1="46" x2="898.5" y2="46" stroke="#00ADB5" stroke-opacity=".18"/>
  <circle cx="28" cy="24" r="5.5" fill="#FF6B6B"/>
  <circle cx="48" cy="24" r="5.5" fill="#F2C811"/>
  <circle cx="68" cy="24" r="5.5" fill="#00ADB5" class="pulse"/>
  <text class="mono dim" x="98" y="29">bijay@nepal ~ zsh</text>
  <text class="mono dim" x="878" y="29" text-anchor="end">GMT+5:45</text>

  <!-- readout -->
  <g class="mono">
    <text class="cmd row d1" x="34" y="86">$ whoami</text>
    <text class="name row d2" x="34" y="122">Bijay Koirala</text>
    <path class="rule" d="M34 134 H 264"/>

    <text class="cmd row d3" x="34" y="170">$ cat focus.txt</text>
    <text class="out row d4" x="34" y="196">python automation, technical seo, chrome extensions</text>

    <text class="cmd row d5" x="34" y="234">$ ls ~/ships</text>
    <text class="out row d6" x="34" y="260">scrapers/   telegram-bots/   clickup-sync/   gsc-reports/</text>

    <text class="cmd row d7" x="34" y="298">$ status</text>
    <text class="out row d8" x="160" y="298">open for freelance, replies in under 24h</text>
  </g>
  <rect class="cursor" x="612" y="285" width="10" height="18"/>
</svg>
