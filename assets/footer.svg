<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="900" height="110" role="img" aria-label="Thanks for stopping by. Email bijaykoirala003 at gmail dot com." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Thanks for stopping by</title>
  <defs>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ADB5" stop-opacity=".38"/>
      <stop offset="1" stop-color="#0F4C5C" stop-opacity=".05"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", sans-serif; }
    .big  { font-size: 20px; font-weight: 600; letter-spacing: .2px; fill: #c9d1d9; }
    .mail { font-size: 15px; font-weight: 500; fill: #00ADB5; font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .drift { animation: drift 16s linear infinite; }
    @keyframes drift { from { transform: translateX(0) } to { transform: translateX(-450px) } }
    @media (prefers-reduced-motion: reduce) { .drift { animation: none } }
  </style>
  <g class="drift">
    <path fill="url(#wave)" d="M0 78 C 112 48, 225 108, 337 78 C 450 48, 562 108, 675 78 C 787 48, 900 108, 1012 78 C 1125 48, 1237 108, 1350 78 L 1350 110 L 0 110 Z"/>
  </g>
  <text class="big"  x="450" y="44" text-anchor="middle">Thanks for stopping by</text>
  <text class="mail" x="450" y="68" text-anchor="middle">bijaykoirala003@gmail.com</text>
</svg>
