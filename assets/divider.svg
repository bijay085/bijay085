<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 6" width="900" height="6" role="presentation" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sweep" x1="0" x2="1">
      <stop offset="0"   stop-color="#00ADB5" stop-opacity="0"/>
      <stop offset=".5"  stop-color="#00ADB5" stop-opacity="1"/>
      <stop offset="1"   stop-color="#00ADB5" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .glow { animation: sweep 7s ease-in-out infinite; }
    @keyframes sweep { 0%{transform:translateX(-300px)} 50%{transform:translateX(700px)} 100%{transform:translateX(-300px)} }
    @media (prefers-reduced-motion: reduce) { .glow { animation: none } }
  </style>
  <rect y="2.5" width="900" height="1" fill="#00ADB5" opacity=".22"/>
  <rect class="glow" y="2" width="300" height="2" rx="1" fill="url(#sweep)"/>
</svg>
