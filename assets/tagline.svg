<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 46" width="860" height="46" role="img" aria-label="Hire a Python and SEO developer from Nepal: bots, scrapers and Chrome extensions; ClickUp, Sheets and Slack automation; technical SEO that moves Search Console; custom tools at prices that make sense." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Hire a Python and SEO developer from Nepal</title>
  <style>
    text { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .prompt { font-size: 18px; font-weight: 700; fill: #00ADB5; }
    .line   { font-size: 18px; font-weight: 600; fill: #c9d1d9; opacity: 0; animation: slot 15s linear infinite; }
    .s2{animation-delay:3s} .s3{animation-delay:6s} .s4{animation-delay:9s} .s5{animation-delay:12s}
    .caret  { fill: #00ADB5; animation: blink 1.05s steps(1) infinite; }
    @keyframes slot { 0%{opacity:0} 2%{opacity:1} 18%{opacity:1} 20%{opacity:0} 100%{opacity:0} }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    @media (prefers-reduced-motion: reduce) {
      .line{animation:none} .line:not(.s2):not(.s3):not(.s4):not(.s5){opacity:1} .caret{animation:none}
    }
  </style>
  <text class="prompt" x="4" y="30">&#8250;</text>
  <g>
    <text class="line"    x="26" y="30">hire a python &amp; seo developer from nepal</text>
    <text class="line s2" x="26" y="30">bots, scrapers and chrome extensions</text>
    <text class="line s3" x="26" y="30">clickup &#8594; sheets &#8594; slack, wired to run itself</text>
    <text class="line s4" x="26" y="30">technical seo that moves search console</text>
    <text class="line s5" x="26" y="30">custom tools at prices that make sense</text>
  </g>
  <rect class="caret" x="26" y="16" width="9" height="17" opacity="0">
    <animate attributeName="opacity" values="0" dur="1s" fill="freeze"/>
  </rect>
</svg>
